<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooster's Health Store & Wellness Bar — Columbia, IL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body { background: #fdf6ee; color: #2d1a0e; font-family: 'DM Sans', Arial, sans-serif; line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
:root {
  --cream: #fdf6ee; --sky: #d9ecf5; --sky2: #c2dff0; --navy: #1c3448; --navy2: #254560;
  --red: #c5362b; --red-hover: #a62d22; --red-dim: rgba(197,54,43,0.09); --red-border: rgba(197,54,43,0.22); --red-glow: rgba(197,54,43,0.25);
  --blue: #4a8fb5; --blue-dim: rgba(74,143,181,0.12);
  --text: #2d1a0e; --muted: rgba(45,26,14,0.62); --subtle: rgba(45,26,14,0.38);
  --border: rgba(45,26,14,0.10); --border-sky: rgba(74,143,181,0.18);
  --white: #ffffff;
  --head: 'Playfair Display', Georgia, serif;
  --body: 'DM Sans', Arial, sans-serif;
  --ease: cubic-bezier(0.4,0,0.2,1);
  --nav-h: 72px; --max-w: 1160px;
  --shadow: 0 4px 28px rgba(0,0,0,0.10);
  --shadow-hover: 0 12px 48px rgba(0,0,0,0.16);
}
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
img { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; font-family: var(--body); }
.fade-in { opacity: 0; transform: translateY(28px); transition: opacity 0.65s var(--ease), transform 0.65s var(--ease); }
.fade-in.visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── TOKENS ────────────────────────────────────────────────────────
const RH = {
  cream:'#fdf6ee', sky:'#d9ecf5', navy:'#1c3448', navy2:'#254560',
  red:'#c5362b', redHover:'#a62d22', redDim:'rgba(197,54,43,0.09)', redBorder:'rgba(197,54,43,0.22)',
  blue:'#4a8fb5', blueDim:'rgba(74,143,181,0.12)',
  text:'#2d1a0e', muted:'rgba(45,26,14,0.62)', subtle:'rgba(45,26,14,0.38)',
  border:'rgba(45,26,14,0.10)', white:'#ffffff',
  head:"'Playfair Display', Georgia, serif", body:"'DM Sans', Arial, sans-serif",
  ease:'cubic-bezier(0.4,0,0.2,1)',
};

// ── SCROLL FADE ──────────────────────────────────────────────────
function useFadeIn() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if(!el) return;
    el.classList.add('fade-in');
    const obs = new IntersectionObserver(([e]) => { if(e.isIntersecting){ el.classList.add('visible'); obs.disconnect(); } }, {threshold:0.1});
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

// ── UTILITY COMPONENTS ────────────────────────────────────────────
function Label({ children, light }) {
  return (
    <span style={{display:'inline-flex', alignItems:'center', fontFamily:RH.body, fontSize:'10.5px', fontWeight:700,
      letterSpacing:'0.22em', textTransform:'uppercase', padding:'5px 16px', borderRadius:'100px', marginBottom:'20px',
      color: light ? RH.sky : RH.red,
      background: light ? 'rgba(217,236,245,0.18)' : RH.redDim,
      border: `1px solid ${light ? 'rgba(217,236,245,0.28)' : RH.redBorder}`
    }}>{children}</span>
  );
}

function Btn({ children, onClick, ghost, light, style={} }) {
  const [h,setH] = useState(false);
  const base = {display:'inline-flex', alignItems:'center', gap:'8px', fontFamily:RH.body, fontSize:'0.925rem',
    fontWeight:700, letterSpacing:'0.025em', padding:'13px 28px', borderRadius:'8px', transition:`all 0.22s ${RH.ease}`,
    transform: h ? 'translateY(-2px)' : 'none', whiteSpace:'nowrap', ...style};
  if(ghost) return <button onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{...base,
    background: h ? (light ? 'rgba(255,255,255,0.15)' : RH.redDim) : 'transparent',
    color: h ? (light ? RH.white : RH.red) : (light ? 'rgba(255,255,255,0.85)' : RH.text),
    border: `1px solid ${h ? (light ? 'rgba(255,255,255,0.45)' : RH.redBorder) : (light ? 'rgba(255,255,255,0.25)' : RH.border)}`
  }}>{children}</button>;
  return <button onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{...base,
    background: h ? RH.redHover : RH.red, color: RH.white,
    boxShadow: h ? `0 0 24px ${RH.redDim}, 0 4px 12px rgba(0,0,0,0.25)` : '0 2px 8px rgba(0,0,0,0.18)'
  }}>{children}</button>;
}

function Cloud({ style }) {
  return (
    <svg viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg" style={{position:'absolute', pointerEvents:'none', ...style}}>
      <ellipse cx="110" cy="70" rx="90" ry="38" fill="currentColor"/>
      <ellipse cx="75" cy="58" rx="48" ry="36" fill="currentColor"/>
      <ellipse cx="148" cy="55" rx="52" ry="34" fill="currentColor"/>
      <ellipse cx="110" cy="50" rx="42" ry="32" fill="currentColor"/>
    </svg>
  );
}

function PhotoSlot({ label, bg, height='100%' }) {
  return (
    <div style={{width:'100%', height, background:bg||'#c2dff0', display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', gap:'10px', borderRadius:'inherit'}}>
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(28,52,72,0.45)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span style={{fontFamily:RH.body, fontSize:'11px', fontWeight:600, letterSpacing:'0.06em', color:'rgba(28,52,72,0.50)',
        textTransform:'uppercase', textAlign:'center', padding:'0 16px'}}>{label}</span>
    </div>
  );
}

// ── NAV ──────────────────────────────────────────────────────────
function Nav({ activeSection }) {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', fn, {passive:true});
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const links = [['Shop','#services'],['Wellness Bar','#bar'],['About Us','#about'],['Contact','#contact']];
  const navBg = scrolled ? 'rgba(28,52,72,0.97)' : 'rgba(28,52,72,0.82)';
  return (
    <nav style={{position:'fixed', top:0, left:0, right:0, height:'88px', zIndex:100,
      background:navBg, backdropFilter:'blur(20px) saturate(1.4)',
      borderBottom: scrolled ? '1px solid rgba(255,255,255,0.08)' : '1px solid transparent',
      transition:`all 0.3s ${RH.ease}`, display:'flex', alignItems:'center', padding:'0 28px'}}>
      <div style={{maxWidth:'1160px', width:'100%', margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
        <a href="#top">
          <img src="uploads/Roosters_Logo-7543289b.png" alt="Rooster's Health Store & Wellness Bar"
            style={{height:'auto', width:'220px', display:'block'}}/>
        </a>
        <div style={{display:'flex', alignItems:'center', gap:'32px'}}>
          {links.map(([label,href]) => (
            <a key={label} href={href} style={{fontFamily:RH.body, fontSize:'0.9rem', fontWeight:600,
              color: activeSection===href.slice(1) ? RH.white : 'rgba(255,255,255,0.72)',
              transition:`color 0.2s`, padding:'4px 0',
              borderBottom: activeSection===href.slice(1) ? `2px solid ${RH.red}` : '2px solid transparent'}}>{label}</a>
          ))}
          <Btn light style={{padding:'10px 22px', fontSize:'0.875rem'}}>Visit Us</Btn>
        </div>
      </div>
    </nav>
  );
}

// ── HERO CAROUSEL ─────────────────────────────────────────────────
const SLIDES = [
  {bg:'linear-gradient(135deg,#1c3448 0%,#2d5a7a 100%)', label:'Store Interior — The Wellness Bar'},
  {bg:'linear-gradient(135deg,#2e5e2e 0%,#4a8c3f 100%)', label:'Fresh Local Produce Display'},
  {bg:'linear-gradient(135deg,#5a3010 0%,#8c5a30 100%)', label:'Local Meats & Fresh Counter'},
  {bg:'linear-gradient(135deg,#1c3448 0%,#3a6080 100%)', label:'The RooSt Recovery Suite'},
  {bg:'linear-gradient(135deg,#4a1c3a 0%,#7a3060 100%)', label:'Community & Events Space'},
];

function Hero() {
  const [cur, setCur] = useState(0);
  const [paused, setPaused] = useState(false);
  const timerRef = useRef();
  const next = useCallback(() => setCur(c => (c+1)%SLIDES.length), []);
  const prev = useCallback(() => setCur(c => (c-1+SLIDES.length)%SLIDES.length), []);
  useEffect(() => {
    if(paused) return;
    timerRef.current = setInterval(next, 5000);
    return () => clearInterval(timerRef.current);
  }, [paused, next]);

  return (
    <section id="top" style={{position:'relative', height:'100vh', minHeight:'600px', overflow:'hidden',
      background:RH.navy, display:'flex', alignItems:'center'}}
      onMouseEnter={()=>setPaused(true)} onMouseLeave={()=>setPaused(false)}>
      {/* Slide backgrounds */}
      {SLIDES.map((s,i) => (
        <div key={i} style={{position:'absolute', inset:0, background:s.bg, opacity:i===cur?1:0,
          transition:`opacity 1.2s ${RH.ease}`, display:'flex', alignItems:'center', justifyContent:'center'}}>
          <PhotoSlot label={s.label} bg="transparent" height="100%" />
        </div>
      ))}
      {/* Overlay */}
      <div style={{position:'absolute', inset:0, background:'linear-gradient(to right, rgba(28,52,72,0.88) 45%, rgba(28,52,72,0.2) 100%)'}}/>
      {/* Cloud decoration */}
      <Cloud style={{bottom:'-10px', right:'-40px', width:'380px', color:'rgba(255,255,255,0.06)'}}/>
      <Cloud style={{bottom:'20px', left:'20%', width:'260px', color:'rgba(255,255,255,0.04)'}}/>
      {/* Content */}
      <div style={{position:'relative', zIndex:2, maxWidth:'1160px', margin:'0 auto', padding:'0 28px', paddingTop:'88px'}}>
        <Label light>Columbia, Illinois — Since 1995</Label>
        <h1 style={{fontFamily:RH.head, fontSize:'clamp(2.8rem,6vw,5rem)', fontWeight:900, color:RH.white,
          lineHeight:1.08, letterSpacing:'-0.03em', maxWidth:'680px', marginBottom:'36px'}}>
          Where fresh, local,<br/><em>and natural</em> meet.
        </h1>
        <p style={{fontFamily:RH.body, fontSize:'1.1rem', color:'rgba(255,255,255,0.75)', maxWidth:'500px',
          lineHeight:1.7, marginBottom:'38px'}}>
          Family-owned community wellness — from farm-fresh local groceries and an apothecary bar to advanced recovery therapies. Your neighbors know your name here.
        </p>
        <div style={{display:'flex', gap:'14px', flexWrap:'wrap'}}>
          <Btn light href="#services">Explore the Store</Btn>
          <Btn ghost light href="#bar">Visit Our Wellness Bar</Btn>
        </div>
      </div>
      {/* Slide controls */}
      <div style={{position:'absolute', bottom:'38px', left:'50%', transform:'translateX(-50%)', zIndex:3,
        display:'flex', alignItems:'center', gap:'12px'}}>
        <button onClick={prev} style={{width:'36px', height:'36px', borderRadius:'50%', background:'rgba(255,255,255,0.12)',
          border:'1px solid rgba(255,255,255,0.2)', color:RH.white, fontSize:'16px', display:'flex',
          alignItems:'center', justifyContent:'center', transition:'all 0.2s', cursor:'pointer'}}
          onMouseEnter={e=>e.target.style.background='rgba(255,255,255,0.22)'}
          onMouseLeave={e=>e.target.style.background='rgba(255,255,255,0.12)'}>‹</button>
        {SLIDES.map((_,i) => (
          <button key={i} onClick={()=>setCur(i)} style={{width: i===cur?24:8, height:'8px', borderRadius:'4px',
            background: i===cur ? RH.red : 'rgba(255,255,255,0.3)',
            border:'none', transition:`all 0.3s ${RH.ease}`, cursor:'pointer', padding:0}}/>
        ))}
        <button onClick={next} style={{width:'36px', height:'36px', borderRadius:'50%', background:'rgba(255,255,255,0.12)',
          border:'1px solid rgba(255,255,255,0.2)', color:RH.white, fontSize:'16px', display:'flex',
          alignItems:'center', justifyContent:'center', transition:'all 0.2s', cursor:'pointer'}}
          onMouseEnter={e=>e.target.style.background='rgba(255,255,255,0.22)'}
          onMouseLeave={e=>e.target.style.background='rgba(255,255,255,0.12)'}>›</button>
      </div>
      {/* Current slide label */}
      <div style={{position:'absolute', bottom:'46px', right:'40px', zIndex:3, fontFamily:RH.body,
        fontSize:'11px', fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase',
        color:'rgba(255,255,255,0.45)'}}>Photo: {SLIDES[cur].label}</div>
    </section>
  );
}

// ── ABOUT ─────────────────────────────────────────────────────────
function About() {
  const ref = useFadeIn();
  return (
    <section id="about" style={{background:RH.cream, padding:'72px 28px', position:'relative', overflow:'hidden'}}>
      <Cloud style={{top:'-30px', right:'-60px', width:'400px', color:RH.sky, opacity:0.7}}/>
      <div ref={ref} style={{maxWidth:'1160px', margin:'0 auto'}}>
        <div style={{textAlign:'center', marginBottom:'44px'}}>
          <Label>Our Story</Label>
          <h2 style={{fontFamily:RH.head, fontSize:'clamp(1.8rem,3.2vw,2.75rem)', fontWeight:700,
            lineHeight:1.12, color:RH.text, marginBottom:'0'}}>
            A personal journey.<br/><em>A community calling.</em>
          </h2>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px', marginBottom:'36px'}}>
          <div style={{borderRadius:'16px', overflow:'hidden', height:'240px'}}>
            <PhotoSlot label="Michelle & Joe — Family Photo" bg="linear-gradient(135deg,#c2dff0,#a8cce4)"/>
          </div>
          <div style={{borderRadius:'16px', overflow:'hidden', height:'240px'}}>
            <PhotoSlot label="Store — Original Location or Milestone Moment" bg="linear-gradient(135deg,#d9ecf5,#bdd8ec)"/>
          </div>
        </div>
        <div style={{maxWidth:'760px', margin:'0 auto'}}>
            <p style={{color:RH.text, lineHeight:1.75, fontSize:'0.98rem', marginBottom:'16px', fontFamily:RH.body}}>
              In 2018, my son, Joe, and I were devastated when we lost my husband to an aggressive form of cancer. At only 50 years old, I couldn't help but wonder what caused his illness and how it could have been prevented. While there were no concrete answers to my questions, I discovered through extensive research that many cancer-causing chemicals were in some of our daily toiletries, the foods we were eating, and the cleaning supplies we used.
            </p>
            <p style={{color:RH.text, lineHeight:1.75, fontSize:'0.98rem', marginBottom:'20px', fontFamily:RH.body}}>
              As I began to eliminate those products from our lives, I also began to implement natural foods and supplements that would boost our immunity levels in an effort to better our health.
            </p>
            <div style={{borderLeft:`3px solid ${RH.red}`, background:RH.redDim, borderRadius:'0 10px 10px 0', padding:'16px 20px', marginBottom:'20px'}}>
              <p style={{fontFamily:RH.head, fontSize:'1rem', fontStyle:'italic', color:RH.text, lineHeight:1.65}}>
                "Since purchasing the store, I've met many friends who are either beginning or continuing their journey to wellness, and it brings me joy to provide every resource I can to help them along the way."
              </p>
            </div>
            <p style={{color:RH.text, lineHeight:1.75, fontSize:'0.98rem', marginBottom:'24px', fontFamily:RH.body}}>
              Not long after that, a health food store in Columbia owned by Marsha and Ken Hahn since 1995 became available — and I saw the opportunity as a God-wink. If I could share the knowledge I'd gained from my own family's experience, perhaps I could make a difference in the lives of others.
            </p>
            <div style={{display:'flex', alignItems:'center', gap:'14px'}}>
              <div style={{width:'46px', height:'46px', borderRadius:'50%', background:RH.sky, overflow:'hidden', flexShrink:0}}>
                <PhotoSlot label="Michelle" bg={RH.sky2}/>
              </div>
              <div>
                <div style={{fontFamily:RH.head, fontSize:'1rem', fontWeight:700, color:RH.text}}>Michelle Swan</div>
                <div style={{fontFamily:RH.body, fontSize:'0.82rem', color:RH.muted}}>Owner, Rooster's Health Store since 2018</div>
              </div>
            </div>
        </div>
      </div>
    </section>
  );
}

// ── SERVICES ──────────────────────────────────────────────────────
const SERVICES = [
  {icon:<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>,
   label:'Natural Grocery', title:'Local & Organic Produce', anchor:'#services',
   desc:'Farm-fresh local dairy, meats, and produce from producers you can name. Dairy-free, gluten-free, keto — we carry it because someone in this community needs it.'},
  {icon:<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>,
   label:'Supplements', title:'Vitamins & Apothecary', anchor:'#services',
   desc:'Responsibly sourced vitamins, essential oils, and medicinal teas. Our onsite nutritionist helps you find exactly what your body needs — no guesswork.'},
  {icon:<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>,
   label:'Wellness Bar', title:"Monroe County's Only Wellness Bar", anchor:'#bar',
   desc:'Organic remedy teas, smoothies crafted for your health goals, kombucha on tap, and frappes without the junk. Our bar staff double as wellness coaches.'},
  {icon:<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
   label:'Health & Beauty', title:'Non-Toxic Personal Care', anchor:'#services',
   desc:'Paraben-free, sulfate-free, and chemical-clean. From fluoride-free toothpastes to organic baby care — what goes on your body matters as much as what goes in it.'},
];

function ServiceCard({ svc }) {
  const [h,setH] = useState(false);
  return (
    <div onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{
      background:RH.white, border:`1px solid ${h ? RH.redBorder : RH.border}`,
      borderRadius:'18px', padding:'34px 28px', boxShadow: h ? '0 12px 44px rgba(0,0,0,0.12)' : '0 4px 22px rgba(0,0,0,0.07)',
      transform: h ? 'translateY(-5px)' : 'none', transition:`all 0.25s ${RH.ease}`,
      position:'relative', overflow:'hidden'}}>
      {h && <div style={{position:'absolute', top:0, left:0, right:0, height:'3px',
        background:`linear-gradient(to right, transparent, ${RH.red}, transparent)`}}/>}
      <div style={{width:'52px', height:'52px', background:RH.redDim, border:`1px solid ${RH.redBorder}`,
        borderRadius:'10px', display:'flex', alignItems:'center', justifyContent:'center',
        color:RH.red, marginBottom:'22px'}}>{svc.icon}</div>
      <div style={{fontFamily:RH.body, fontSize:'10.5px', fontWeight:700, letterSpacing:'0.18em',
        textTransform:'uppercase', color:RH.red, marginBottom:'8px'}}>{svc.label}</div>
      <h3 style={{fontFamily:RH.head, fontSize:'1.25rem', fontWeight:700, color:RH.text,
        marginBottom:'12px', lineHeight:1.2}}>{svc.title}</h3>
      <p style={{color:RH.muted, lineHeight:1.7, fontSize:'0.95rem'}}>{svc.desc}</p>
    </div>
  );
}

function Services() {
  const ref = useFadeIn();
  return (
    <section id="services" style={{background:RH.sky, padding:'108px 28px', position:'relative', overflow:'hidden'}}>
      <Cloud style={{top:'-20px', left:'-60px', width:'350px', color:RH.white, opacity:0.6}}/>
      <Cloud style={{bottom:'-30px', right:'-40px', width:'300px', color:RH.white, opacity:0.5}}/>
      <div ref={ref} style={{maxWidth:'1160px', margin:'0 auto'}}>
        <div style={{textAlign:'center', marginBottom:'56px'}}>
          <Label>What We Offer</Label>
          <h2 style={{fontFamily:RH.head, fontSize:'clamp(1.8rem,3.2vw,2.75rem)', fontWeight:700,
            lineHeight:1.12, color:RH.navy, marginBottom:'16px'}}>Everything your body needs, <em>under one roof.</em></h2>
          <p style={{color:RH.muted, maxWidth:'580px', margin:'0 auto', lineHeight:1.72, fontSize:'1rem'}}>
            From farm to supplement to smoothie — Rooster's is the only stop you need for a fully nourished life in Monroe County.
          </p>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'22px', maxWidth:'900px', margin:'0 auto'}}>
          {SERVICES.map(s => <ServiceCard key={s.label} svc={s}/>)}
        </div>
      </div>
    </section>

function StoreCarousel() {
  const trackRef = useRef(null);
  const [offset, setOffset] = useState(0);
  const CARD_W = 340;
  const GAP = 16;
  const total = STORE_PHOTOS.length;

  useEffect(() => {
    const interval = setInterval(() => {
      setOffset(o => {
        const next = o + 1;
        return next >= total ? 0 : next;
      });
    }, 3000);
    return () => clearInterval(interval);
  }, [total]);

  const translateX = -(offset * (CARD_W + GAP));

  return (
    <div style={{background:RH.cream, padding:'0 0 72px', overflow:'hidden'}}>
      <div style={{overflow:'hidden', position:'relative'}}>
        <div ref={trackRef} style={{display:'flex', gap:`${GAP}px`, padding:'0 28px',
          transform:`translateX(${translateX}px)`, transition:`transform 0.6s ${RH.ease}`}}>
          {[...STORE_PHOTOS, ...STORE_PHOTOS].map((p,i) => (
            <div key={i} style={{flexShrink:0, width:`${CARD_W}px`, height:'240px',
              borderRadius:'16px', overflow:'hidden', border:`1px solid ${RH.border}`}}>
              <PhotoSlot label={p.label} bg={p.bg} height="240px"/>
            </div>
          ))}
        </div>
      </div>
      <div style={{display:'flex', justifyContent:'center', gap:'8px', marginTop:'20px'}}>
        {STORE_PHOTOS.map((_,i) => (
          <button key={i} onClick={()=>setOffset(i)} style={{width: i===offset?24:8, height:'8px',
            borderRadius:'4px', background: i===offset ? RH.red : RH.border,
            border:'none', transition:`all 0.3s ${RH.ease}`, cursor:'pointer', padding:0}}/>
        ))}
      </div>
    </div>
  );
}

                  borderRadius:'10px', display:'flex', alignItems:'center', justifyContent:'center',
                  color:RH.red, flexShrink:0}}>{icon}</div>
                <div>
                  <div style={{fontFamily:RH.body, fontSize:'11px', fontWeight:700, letterSpacing:'0.15em', textTransform:'uppercase', color:RH.subtle, marginBottom:'4px'}}>{label}</div>
                  <div style={{fontFamily:RH.body, fontSize:'0.95rem', color:RH.text, fontWeight:500, whiteSpace:'pre-line', lineHeight:1.55}}>{val}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div style={{background:RH.white, borderRadius:'22px', padding:'40px', boxShadow:'0 6px 32px rgba(0,0,0,0.09)', border:`1px solid ${RH.border}`}}>
          {sent ? (
            <div style={{textAlign:'center', padding:'30px 0'}}>
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke={RH.red} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style={{margin:'0 auto 18px'}}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <h3 style={{fontFamily:RH.head, fontSize:'1.4rem', color:RH.text, marginBottom:'10px'}}>Message received!</h3>
              <p style={{color:RH.muted, marginBottom:'24px', lineHeight:1.65}}>We'll be in touch shortly. Looking forward to meeting you in store.</p>
              <Btn onClick={()=>setSent(false)}>Send Another</Btn>
            </div>
          ) : (
            <>
              <h3 style={{fontFamily:RH.head, fontSize:'1.5rem', color:RH.text, marginBottom:'6px'}}>Send us a message</h3>
              <p style={{fontFamily:RH.body, fontSize:'0.92rem', color:RH.muted, marginBottom:'28px'}}>Questions, special orders, or just saying hi — we read every one.</p>
              <form onSubmit={submit} style={{display:'flex', flexDirection:'column', gap:'14px'}}>
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px'}}>
                  {[['Your Name','name','text'],['Phone (optional)','phone','tel']].map(([ph,k,t]) => (
                    <input key={k} type={t} placeholder={ph} value={form[k]}
                      onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}
                      style={{fontFamily:RH.body, fontSize:'0.92rem', padding:'12px 14px', borderRadius:'10px',
                        border:`1px solid ${RH.border}`, outline:'none', color:RH.text, background:'#fafaf8'}}/>
                  ))}
                </div>
                <input type="email" placeholder="Email Address" required value={form.email}
                  onChange={e=>setForm(f=>({...f,email:e.target.value}))}
                  style={{fontFamily:RH.body, fontSize:'0.92rem', padding:'12px 14px', borderRadius:'10px',
                    border:`1px solid ${RH.border}`, outline:'none', color:RH.text, background:'#fafaf8'}}/>
                <textarea placeholder="How can we help you today?" required value={form.message}
                  onChange={e=>setForm(f=>({...f,message:e.target.value}))}
                  style={{fontFamily:RH.body, fontSize:'0.92rem', padding:'12px 14px', borderRadius:'10px',
                    border:`1px solid ${RH.border}`, outline:'none', color:RH.text, resize:'vertical',
                    minHeight:'110px', background:'#fafaf8'}}/>
                <Btn style={{justifyContent:'center'}}>Send Message →</Btn>
              </form>
            </>
          )}
        </div>
      </div>
    </section>
  );
}

// ── APP ──────────────────────────────────────────────────────────
function App() {
  const [activeSection, setActiveSection] = useState('');
  useEffect(() => {
    const sections = ['services','bar','about','contact'];
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting) setActiveSection(e.target.id); });
    }, {threshold:0.3});
    sections.forEach(id => { const el = document.getElementById(id); if(el) obs.observe(el); });
    return () => obs.disconnect();
  }, []);
  return (
    <>
      <Nav activeSection={activeSection}/>
      <Hero/>
      <Services/>
      <StoreCarousel/>
      <RooStTeaser/>
      <Team/>
      <Reviews/>
      <FAQ/>
      <SpecialOrders/>
      <About/>
      <Contact/>
      <Footer/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
